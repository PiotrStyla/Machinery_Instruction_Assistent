[project]
name = "slayer1b-inference"
version = "0.1.0"
description = "Architecture-preserving low-memory inference runtime for Slayer1B"
requires-python = ">=3.10"
dependencies = [
  "huggingface-hub>=0.30",
  "numpy>=1.26",
  "psutil>=6.0",
  "safetensors>=0.5",
  "tokenizers>=0.21",
  "torch>=2.2",
]

[project.optional-dependencies]
graphiti = [
  "graphiti-core[kuzu]==0.31.2",
  "torch==2.14.0",
  "transformers==4.57.6",
]
routing = [
  "laya==0.3.4",
  "torch==2.14.0",
  "transformers==4.57.6",
]
training = [
  "numpy==2.3.5",
  "torch==2.14.0",
  "tokenizers==0.23.3",
  "safetensors==0.8.0",
]

[tool.ruff]
line-length = 120
